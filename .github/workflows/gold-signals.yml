name: gold-signals

on:
  schedule:
    # minutes 1,16,31,46 = just after each 15m candle closes; Sun-Fri (gold is closed Saturday). Times are UTC.
    - cron: "1,16,31,46 * * * 0-5"
  workflow_dispatch:        # lets you press "Run workflow" manually to test

permissions:
  contents: write           # needed to save state.json

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas requests yfinance

      - name: Check for signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_SOURCE: yahoo          # or: twelvedata (then also add TWELVE_API_KEY secret below)
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TF: 15m
        run: python cloud_check.py

      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
