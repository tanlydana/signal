name: gold-signals

on:
  schedule:
    - cron: "2,17,32,47 * * * 0-5"   # Automated 15m backup check (runs at :02, :17, :32, :47 UTC)
  workflow_dispatch:                  # lets you press "Run workflow" manually in GitHub Actions to test

permissions:
  contents: write           # needed to save state.json

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas requests yfinance

      - name: Check for signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_SOURCE: yahoo          # or: twelvedata (then also add TWELVE_API_KEY secret below)
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TF: 15m
          RAILWAY_URL: "https://web-production-48020.up.railway.app"
        run: python cloud_check.py

      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci] [skip railway]" && git push)
